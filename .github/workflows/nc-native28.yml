name: Nosso Combinado 2.8 — Android NATIVO completo
on:
  push:
    branches: [nosso-combinado-nativo28]
    paths:
      - 'nc-native28-patch/**'
      - '.github/workflows/nc-native28.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Instalar Android SDK
      run: |
        SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
        test -n "$SDKMANAGER"
        "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Extrair fonte Nativa completa
      run: |
        mkdir -p nc-native28-build
        base64 --decode nosso-combinado/android-native.tar.gz.b64 | tar -xz -C nc-native28-build
        test -s nc-native28-build/app/src/main/java/com/nossocombinado/app/MainActivity.java
        test -s nc-native28-build/app/src/main/java/com/nossocombinado/app/OfflineDb.java
        test -s nc-native28-build/app/src/main/java/com/nossocombinado/app/ApiClient.java
    - name: Aplicar correções nativas 2.8
      run: python3 nc-native28-patch/apply.py nc-native28-build
    - name: Compilar APK nativo 2.8
      run: gradle --no-daemon -p nc-native28-build :app:assembleDebug
    - name: Inspecionar tamanho e assinatura
      run: |
        APK=nc-native28-build/app/build/outputs/apk/debug/app-debug.apk
        test -s "$APK"
        unzip -t "$APK" | tail -1
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
        "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion:|application-label:'
        unzip -l "$APK" | grep -E 'classes[0-9]*.dex|resources.arsc'
        SIZE=$(stat -c %s "$APK")
        echo "APK Nativo 2.8 size=$SIZE bytes"
        test "$SIZE" -gt 1000000
    - name: Artefato APK instalado
      uses: actions/upload-artifact@v4
      with:
        name: NossoCombinado_NATIVO_2_8
        path: nc-native28-build/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    - name: Publicar APK
      run: |
        mkdir -p nc-native28-patch/dist
        cp nc-native28-build/app/build/outputs/apk/debug/app-debug.apk nc-native28-patch/dist/NossoCombinado_NATIVO_2_8_INSTALAVEL.apk
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add nc-native28-patch/dist/NossoCombinado_NATIVO_2_8_INSTALAVEL.apk
        if ! git diff --cached --quiet; then
          git commit -m "APK nativo 2.8 compilado e assinado"
          git push origin HEAD:nosso-combinado-nativo28
        fi
