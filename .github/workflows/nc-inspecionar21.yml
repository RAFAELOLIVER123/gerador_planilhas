name: Investigar codigo original Android 2.1
on:
  push:
    branches: [nosso-combinado-21-correcoes]
    paths: ['.github/workflows/nc-inspecionar21.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir codigo-fonte original e localizar rotinas
        run: |
          mkdir -p android-v1
          base64 --decode nosso-combinado/release-v1-source.tar.gz.b64 | tar -xzf - -C android-v1
          python3 nosso-combinado/nc-native-1-7-patch.py android-v1
          python3 nosso-combinado/nc-native-1-8-patch.py android-v1
          python3 nosso-combinado/nc-native-1-9-patch.py
          python3 nosso-combinado/nc-native-2-0-patch.py android-v1
          python3 nosso-combinado/nc-native-2-1-patch.py android-v1
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-v1/app/src/main/java/com/nossocombinado/app')
          for p in sorted(root.glob('*.java')):
              print('FILE',p.name,len(p.read_text().splitlines()))
          for fn in ['MainActivity.java','ReminderReceiver.java','ReminderScheduler.java','AlarmActivity.java','AlarmService.java','BootReceiver.java','ReminderBootReceiver.java']:
              p=root/fn
              if not p.exists():continue
              lines=p.read_text().splitlines()
              intervals=[(43,68),(230,264),(540,578)] if fn=='MainActivity.java' else [(1,len(lines))]
              print('=====FILE',fn)
              for lo,hi in intervals:
                  for i in range(lo-1,min(hi,len(lines))):
                      print(f'{i+1}: {lines[i]}')
          PY
