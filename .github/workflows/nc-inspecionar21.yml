name: Investigar codigo original Android 2.1
on:
  push:
    branches: [nosso-combinado-21-correcoes]
    paths: ['.github/workflows/nc-inspecionar21.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir codigo-fonte original e localizar rotinas
        run: |
          mkdir -p android-v1
          base64 --decode nosso-combinado/release-v1-source.tar.gz.b64 | tar -xzf - -C android-v1
          python3 nosso-combinado/nc-native-1-7-patch.py android-v1
          python3 nosso-combinado/nc-native-1-8-patch.py android-v1
          python3 nosso-combinado/nc-native-1-9-patch.py
          python3 nosso-combinado/nc-native-2-0-patch.py android-v1
          python3 nosso-combinado/nc-native-2-1-patch.py android-v1
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-v1/app/src/main/java/com/nossocombinado/app')
          for filename in ['MainActivity.java','AlarmReceiver.java','AlarmService.java','AlarmScheduler.java','ReminderScheduler.java']:
              p=root/filename
              if not p.exists():continue
              lines=p.read_text().splitlines()
              print('=====',filename,'LINES',len(lines))
              matches=[i for i,line in enumerate(lines) if any(k in line.lower() for k in ['postdelayed','alarmmanager','setexact','realtime','notification','chat(', 'privatechat','private_thread','privatechats','privatethread','messages','sound','nc_alarm','audiomanager','schedule','sync','handler'])]
              seen=set()
              for i in matches[:180]:
                  for j in range(max(0,i-1),min(len(lines),i+2)):
                      if j not in seen:print(f'{j+1:4d} {lines[j][:310]}');seen.add(j)
          PY
